name: CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyx-tournament-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/nyx_ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Namecheap cPanel
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing NAMECHEAP_HOST secret}"
          : "${SSH_USER:?Missing NAMECHEAP_USER secret}"
          : "${SSH_PORT:?Missing NAMECHEAP_PORT secret}"
          : "${SSH_PRIVATE_KEY:?Missing NAMECHEAP_SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing NAMECHEAP_KNOWN_HOSTS secret}"
          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "NAMECHEAP_PORT must contain a numeric SSH port." >&2
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/namecheap_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/namecheap_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Update application, migrate, and restart
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/namecheap_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/magwkdjx/repositories/NYX_Tournament_Backend

          CPANEL_NODE_ACTIVATE=/home/magwkdjx/nodevenv/repositories/NYX_Tournament_Backend/24/bin/activate
          if [[ -f "$CPANEL_NODE_ACTIVATE" ]]; then
            source "$CPANEL_NODE_ACTIVATE"
          fi
          NODE_MAJOR="$(node -p 'Number(process.versions.node.split(".")[0])')"
          if (( NODE_MAJOR != 24 )); then
            echo "The cPanel application must use Node.js 24." >&2
            exit 1
          fi

          git pull --ff-only origin main
          npm ci --include=dev
          npx prisma generate
          npx prisma migrate deploy
          npm prune --omit=dev

          mkdir -p tmp
          touch tmp/restart.txt
          REMOTE
